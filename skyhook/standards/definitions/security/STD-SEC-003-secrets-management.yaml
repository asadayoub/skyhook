schemaVersion: "1.0.0"
id: "STD-SEC-003"
title: "Secrets Management & Centralized Environment Validation"
category: "security"
domain: "configuration"
tags: ["secrets", "env", "security", "config", "credentials"]
severity: "critical"
version: "1.0.0"

summary: "Zero credentials or API keys in source control; read environment variables through centralized validated config."

guidelines:
  - "Never commit hardcoded secrets, private keys, or passwords into source code or git history."
  - "Do not directly access process.env or os.environ outside of dedicated configuration/settings modules."
  - "Validate all required environment variables on application startup using a strict schema (Zod/Pydantic)."
  - "Provide a sanitized .env.example with dummy values for developer onboarding."

acceptanceCriteria:
  - "No API keys, passwords, or tokens in source files or git history."
  - "Central configuration module crashes early with descriptive message if required environment variable is missing."

automatedRules:
  - ruleId: "no-direct-env-access"
    type: "ast-pattern"
    pattern: "\\bprocess\\.env(\\.[A-Za-z0-9_]+|\\[['\"`][A-Za-z0-9_]+['\"`]\\])|\\bos\\.(environ|getenv)\\b"
    allowedPaths: ["**/config/**", "**/settings/**", "**/env/**", "**/cli/**", "**/.env*"]
    ignoredPaths: ["**/test/**", "**/*.test.*", "**/*.spec.*", "**/fixtures/**"]
    severity: "error"
    message: "Direct access to process.env or os.getenv outside configuration module."
    suggestion: "Import validated configuration variables from your central config module."

remediation: "Move environment variable lookup to a central config/settings file and import the validated value."

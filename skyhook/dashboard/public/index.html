<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKYHOOK // ARCHITECTURE RADAR</title>
  <link rel="stylesheet" href="/cyber.css">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    if (window.mermaid) {
      mermaid.initialize({
        startOnLoad: false,
        theme: 'dark',
        themeVariables: {
          darkMode: true,
          background: '#090d16',
          primaryColor: '#00f0ff',
          primaryTextColor: '#f0f6fc',
          primaryBorderColor: '#00f0ff',
          lineColor: '#38bdf8',
          secondaryColor: '#a855f7',
          tertiaryColor: '#10b981'
        }
      });
    }
  </script>
</head>
<body>
  <!-- HUD Header Shell -->
  <header id="headerContainer" class="hud-header">
    <div class="brand">
      <div class="brand-title">SKYHOOK // ARCHITECTURE RADAR</div>
    </div>
  </header>

  <!-- Telemetry HUD Overview -->
  <div id="telemetryContainer" style="max-width: 1600px; margin: 24px auto 0 auto; padding: 0 24px;"></div>

  <!-- Dynamic Router View Container -->
  <main id="mainContent" style="max-width: 1600px; margin: 0 auto; padding: 0 24px 48px 24px;">
    <div class="glass-panel" style="text-align: center; padding: 60px; color: var(--text-dim); font-family: var(--font-mono);">
      INITIALIZING SKYHOOK MODULAR RUNTIME...
    </div>
  </main>

  <!-- Cybernetic File Viewer / Inspector Modal -->
  <div id="fileModal" class="modal-overlay"></div>

  <!-- Modular Application Bootloader -->
  <script type="module" src="/main.js"></script>
</body>
</html>

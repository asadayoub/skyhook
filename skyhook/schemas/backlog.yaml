# Skyhook Backlog Schema
# Version: 1.0.0
# Defines structure for epics, stories, tasks, and prioritization

schemaVersion: "1.0.0"
definitions:
  workItemBase:
    type: "object"
    required: ["id", "title", "description", "type", "status", "priority", "createdAt", "updatedAt"]
    properties:
      id:
        type: "string"
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
      title:
        type: "string"
        minLength: 1
        maxLength: 200
      description:
        type: "string"
      type:
        type: "string"
        enum: ["epic", "story", "task", "subtask", "bug", "spike", "chore", "release"]
      status:
        type: "string"
        enum: ["backlog", "ready", "in-progress", "in-review", "done", "blocked", "cancelled"]
        default: "backlog"
      priority:
        type: "integer"
        minimum: 0
        maximum: 100
        default: 50
        description: "Priority score (0-100, higher = more important)"
      estimate:
        type: "object"
        properties:
          value:
            type: "number"
          unit:
            type: "string"
            enum: ["story-points", "hours", "days", "t-shirt"]
            default: "story-points"
          confidence:
            type: "number"
            minimum: 0
            maximum: 1
      assignee:
        type: "object"
        properties:
          type:
            type: "string"
            enum: ["human", "agent", "unassigned"]
          identifier:
            type: "string"
          name:
            type: "string"
      tags:
        type: "array"
        items:
          type: "string"
      metadata:
        type: "object"
        additionalProperties: true
      createdAt:
        type: "string"
        format: "date-time"
      updatedAt:
        type: "string"
        format: "date-time"
      startedAt:
        type: "string"
        format: "date-time"
      completedAt:
        type: "string"
        format: "date-time"

  epic:
    allOf:
      - $ref: "#/definitions/workItemBase"
      - type: "object"
        required: ["goal", "successMetrics"]
        properties:
          goal:
            type: "string"
            description: "High-level outcome this epic achieves"
          successMetrics:
            type: "array"
            items:
              type: "string"
          childStories:
            type: "array"
            items:
              type: "string"
              pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
          targetDate:
            type: "string"
            format: "date"

  story:
    allOf:
      - $ref: "#/definitions/workItemBase"
      - type: "object"
        required: ["userStory", "acceptanceCriteria", "epicId"]
        properties:
          userStory:
            type: "string"
            description: "As a [role], I want [action], so that [benefit]"
          acceptanceCriteria:
            type: "array"
            items:
              type: "string"
          epicId:
            type: "string"
            pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
          relatedRequirements:
            type: "array"
            items:
              type: "string"
              pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
          tasks:
            type: "array"
            items:
              type: "string"
              pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
          definitionOfReady:
            type: "array"
            items:
              type: "string"
          definitionOfDone:
            type: "array"
            items:
              type: "string"

  task:
    allOf:
      - $ref: "#/definitions/workItemBase"
      - type: "object"
        required: ["storyId"]
        properties:
          storyId:
            type: "string"
            pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
          technicalNotes:
            type: "string"
          dependencies:
            type: "array"
            items:
              type: "string"
              pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"

# Backlog structure
backlog:
  type: "object"
  required: ["schemaVersion", "metadata", "epics", "stories", "tasks"]
  properties:
    schemaVersion:
      type: "string"
      const: "1.0.0"
    metadata:
      type: "object"
      required: ["createdAt", "updatedAt", "version"]
      properties:
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
        version:
          type: "string"
    epics:
      type: "array"
      items:
        $ref: "#/definitions/epic"
    stories:
      type: "array"
      items:
        $ref: "#/definitions/story"
    tasks:
      type: "array"
      items:
        $ref: "#/definitions/task"
    prioritization:
      type: "object"
      properties:
        method:
          type: "string"
          enum: ["wsjf", "rice", "mooscow", "kano", "custom"]
          default: "wsjf"
        criteria:
          type: "object"
          additionalProperties:
            type: "number"

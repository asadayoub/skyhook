name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run verification test suite
        run: npm test
      - name: Create release distribution archive
        run: |
          tar -czf skyhook-${{ github.ref_name }}.tar.gz package.json README.md LICENSE TESTING.md skyhook/
      - uses: softprops/action-gh-release@v1
        with:
          files: skyhook-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false

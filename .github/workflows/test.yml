name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npm test
      - run: node skyhook/cli/skyhook.js version
      - run: |
          mkdir -p /tmp/test-project && cd /tmp/test-project
          node ../skyhook-repo/skyhook/cli/skyhook.js init --profile=web-app
          echo '{"command":"listCurrentFeatures","args":{}}' | node ../skyhook-repo/skyhook/commands/index.js
